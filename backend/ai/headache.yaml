opening: "Od trzech dni lekko boli mnie głowa. Zapytałem AI i teraz boję się, że mam raka. Czy mogę dostać skierowanie na skan?"
facts:
  distinction: "Ból rozwinął się stopniowo. Nie było nagłego początku ani zaburzeń widzenia."
  onset: "Trzy dni temu"
  intensity: "Lekki, około 3 na 10"
  sensation: "Tępy ucisk po obu stronach czoła"
  timing: "Najbardziej zauważalny po południu"
  ai_answer: "AI napisała, że guz jest jedną z możliwych przyczyn. Pacjent odebrał to jako rozpoznanie."
behavior:
  - "Gdy lekarz zbywa obawy, pacjent dopytuje, skąd lekarz ma pewność."
  - "Gdy lekarz uznaje strach i dopytuje, pacjent spokojniej opisuje objawy."
  - "Gdy lekarz tłumaczy plan, pacjent może się uspokoić i zapytać o kolejny krok."

