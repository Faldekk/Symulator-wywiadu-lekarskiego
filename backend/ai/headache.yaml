hard:
  opening: "Boli mnie głowa i boję się, że to rak. Poprzedni lekarz powiedział: „Proszę nie gadać bzdur”. Pan też mnie tak potraktuje?"
  behavior: "Pacjent jest przestraszony i zły po poprzedniej wizycie. Jeśli lekarz bagatelizuje obawy, pacjent prosi o wyjaśnienie i może odpowiedzieć ostrzej. Jeśli lekarz zauważa jego obawę i wyjaśnia konkretne kroki, pacjent stopniowo zaczyna współpracować."
diagnosis:
  differentiation: "Stopniowy, obustronny tępy ucisk o małym nasileniu wspiera rozpoznanie robocze. Wypowiedź AI tłumaczy niepokój pacjenta; o ocenie decydują cechy bólu i pytania o objawy alarmowe."
  label: "Obraz zgodny z napięciowym bólem głowy w tym scenariuszu"

